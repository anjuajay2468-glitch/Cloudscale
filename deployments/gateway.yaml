apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: cloudscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: 315584099639.dkr.ecr.us-east-1.amazonaws.com/cloudscale-gateway:latest
          imagePullPolicy: Always
          command:
            - /app/cloudscale-gateway
            - --port
            - "9000"
            - --nodes
            - http://node1:8001,http://node2:8002,http://node3:8003
          env:
            - name: CLOUDSCALE_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudscale-gateway-keys
                  key: admin-key
            - name: CLOUDSCALE_READER_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudscale-gateway-keys
                  key: reader-key
          ports:
            - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: cloudscale
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 30900

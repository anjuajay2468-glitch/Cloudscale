apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cloudscale
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: cloudscale-nodes
        metrics_path: /metrics
        static_configs:
          - targets:
              - node1:8001
              - node2:8002
              - node3:8003
